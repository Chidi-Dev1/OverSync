[package]
name = "oversync-htlc"
description = "Hash time-lock contract for the OverSync cross-chain bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
oversync-resolver-registry = { path = "../resolver-registry" }
# soroban-env-host 22.1.3 declares ed25519-dalek as an open `>=2.0.0` range, so a
# fresh resolve now picks 3.x, whose rand_core 0.9 traits are incompatible with
# the rand_chacha 0.3 PRNG its testutils pass to SigningKey::generate. Pin it to
# 2.x here (test-only; never compiled into the contract wasm).
ed25519-dalek = "=2.2.0"
